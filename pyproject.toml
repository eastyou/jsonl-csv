[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonl-csv"
version = "0.1.0"
description = "JSONL 与 CSV 双向流式转换 CLI，适合大文件与管道处理"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["jsonl", "csv", "converter", "cli", "data"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Utilities",
]

[project.scripts]
jsonlcsv = "jsonlcsv.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/jsonl-csv"
Source = "https://github.com/eastyou/jsonl-csv"

[tool.setuptools]
packages = ["jsonlcsv"]
